watchlist:
  - symbol: "QQQ"
    timeframe: "1d"
    ema_layers: [40, 120, 350]
    cci_period: 20
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    proximity_pct: 0.003
    cci_lookback: 10

  - symbol: "SPY"
    timeframe: "15m"
    ema_layers: [60, 125, 250]
    cci_period: 20
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    proximity_pct: 0.003
    cci_lookback: 10

  - symbol: "BTC-USD"
    timeframe: "1h"
    ema_layers: [50, 100, 200]
    cci_period: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    proximity_pct: 0.005
    cci_lookback: 10

scheduler:
  interval_minutes: 15

alerts:
  telegram: false
  discord: false
  trademind_api: true
  trademind_endpoint: "https://www.trademind.bot/api/signals/notify"
